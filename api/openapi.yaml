  '/api/v1/compare':
    get:
      tags:
        - changes
      summary: 'Compare any two snapshots on demand'
      description: 'Both snapshots must belong to the same monitor and both must have succeeded. The pair is ordered chronologically, so `a` and `b` may be given in either order. With `store=false` (the default) nothing is written. With `store=true`, cookie-authenticated requests must include X-CSRF-Token because the comparison is saved.'
      parameters:
        - name: a
          in: query
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$'
        - name: b
          in: query
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$'
        - name: store
          in: query
          required: false
          schema:
            default: false
            type: string
            enum:
              - true
              - false
      responses:
        '200':
          description: 'The comparison.'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/CompareResult'
        '400':
          description: 'Bad request.'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Error'
        '401':
          description: 'Not authenticated.'
          content:
            application/json:
              schema:
