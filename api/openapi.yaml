            application/json:
              schema:
                '$ref': '#/components/schemas/HealthResponse'
      security: []
  '/readyz':
    get:
      tags:
        - system
      summary: 'Readiness probe'
      description: 'Checks the database, writes and deletes a probe file in the storage backend, and verifies Chromium can launch. In `api` mode the browser check is reported as skipped rather than failing. Also served at `/api/v1/readyz`.'
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ReadyResponse'
        '503':
          description: 'Not ready; `checks` says which dependency failed.'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ReadyResponse'
      security: []
  '/metrics':
    get:
      tags:
        - system
      summary: 'Prometheus metrics'
      description: 'Exposes `pagefreeze_captures_total{status}`, `pagefreeze_capture_duration_seconds`, `pagefreeze_changes_total{significant}`, `pagefreeze_queue_depth{queue}`, `pagefreeze_captures_in_flight`, `pagefreeze_monitors_total`, `pagefreeze_snapshots_total`, `pagefreeze_storage_bytes` and `pagefreeze_process_uptime_seconds`. Also served at `/api/v1/metrics`.'
      responses:
        '200':
          description: 'Prometheus text exposition format.'
          content:
            text/plain:
              schema:
                type: string
      security: []
